<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 60px 70px;
      position: relative;
    }
    /* 装飾グラデーションサークル */
    .glow-1 {
      position: absolute;
      top: -100px;
      right: -100px;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.45) 0%, rgba(99, 102, 241, 0) 70%);
      border-radius: 50%;
    }
    .glow-2 {
      position: absolute;
      bottom: -120px;
      left: 150px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.35) 0%, rgba(236, 72, 153, 0) 70%);
      border-radius: 50%;
    }

    /* ヘッダーバッジ */
    .header-badge-row {
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 2;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 19px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.05em;
    }
    .badge-sub {
      color: #cbd5e1;
      font-size: 19px;
      font-weight: 600;
    }

    /* メインコンテンツ */
    .main-content {
      z-index: 2;
      margin-top: 10px;
    }
    .main-title {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .main-title span.highlight {
      background: linear-gradient(90deg, #38bdf8, #818cf8, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .main-catch {
      font-size: 26px;
      font-weight: 700;
      color: #f1f5f9;
      background: rgba(255, 255, 255, 0.1);
      padding: 12px 24px;
      border-radius: 12px;
      display: inline-block;
      border-left: 5px solid #38bdf8;
      margin-bottom: 12px;
    }
    .description {
      font-size: 20px;
      color: #cbd5e1;
      line-height: 1.5;
      font-weight: 500;
    }

    /* フッター */
    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 2;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding-top: 24px;
    }
    .features {
      display: flex;
      gap: 20px;
    }
    .feature-tag {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 600;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .feature-tag::before {
      content: "✓";
      color: #38bdf8;
      font-weight: 900;
    }
    .url-tag {
      font-size: 20px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="header-badge-row">
    <div class="badge">草加市選挙 2026</div>
    <div class="badge-sub">草加市長選挙 ＆ 市議会議員選挙</div>
  </div>

  <div class="main-content">
    <h1 class="main-title">
      候補者ナビ<br>
      <span class="highlight">公報をスマホでサクッと読み比べ</span>
    </h1>
    <div class="main-catch">
      【全40名網羅】顔ぶれ・重点公約・一般質問実績をスピード比較
    </div>
  </div>

  <div class="footer-row">
    <div class="features">
      <div class="feature-tag">全候補者の公報拡大対応</div>
      <div class="feature-tag">現職の議会質問実績を網羅</div>
      <div class="feature-tag">スマホ最適化・登録不要</div>
    </div>
    <div class="url-tag">soka-shigikai.vercel.app</div>
  </div>
</body>
</html>
